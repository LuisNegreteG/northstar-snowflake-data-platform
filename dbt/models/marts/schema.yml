version: 2

models:

  - name: dim_customer
    description: Customer dimension for analytics.

    columns:

      - name: customer_id
        tests:
          - unique
          - not_null

      - name: customer_status
        tests:
          - accepted_values:
              values: ['ACTIVE', 'INACTIVE']


  - name: dim_product
    description: Product dimension for analytics.

    columns:

      - name: product_id
        tests:
          - unique
          - not_null


  - name: fact_orders
    description: Valid orders fact table for analytics.

    columns:

      - name: order_id
        tests:
          - unique
          - not_null

      - name: customer_id
        tests:
          - relationships:
              to: ref('dim_customer')
              field: customer_id

      - name: product_id
        tests:
          - relationships:
              to: ref('dim_product')
              field: product_id


  - name: mart_sales_daily
    description: Daily completed-sales KPIs.

    columns:

      - name: order_date
        tests:
          - unique
          - not_null


  - name: mart_customer_360
    description: Customer-level analytical view combining commerce and digital engagement.

    columns:

      - name: customer_id
        tests:
          - unique
          - not_null